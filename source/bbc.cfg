# Master 128, see platform/bbc/defs.s for the memory map
MEMORY {
    LOW:     file = "%O-low.bin",  start = $0E00, size = $0400;
    HALVARS: file = "", start = $1200, size = $0400;
    MID:     file = "%O-mid.bin",  start = $3000, size = $5000;
    SCREENS: file = "%O-scr.bin", start = $B800, size = $0800;
    GFX:     file = "%O-gfx.bin",  start = $8000, size = $4000, fill = no;
}
SEGMENTS {
    LOW:      load = LOW,      type = ro;
    HALVARS:  load = HALVARS,  type = bss;
    CODE:     load = MID,      type = ro;
    SCREENS:  load = SCREENS,  type = ro;
    GFX:      load = GFX,      type = ro, align = 256;
}
